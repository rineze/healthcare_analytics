# Copy this to config.yaml and fill in your own accounts.
# config.yaml is gitignored. This example file is not.
#
# The most important field in here is tax_type. No broker export tells you
# whether an account is taxable, a Roth, or a 401k, and the tax agent cannot
# do anything useful without it. Fill it in once and forget about it.

accounts:
  # account_id is a slug you choose. It never changes, so keep it short and
  # obvious. It is what shows up in every report.
  - account_id: fid-brokerage
    platform: fidelity          # fidelity | empower | robinhood | manual
    label: "Fidelity Individual"
    # taxable | traditional_ira | roth_ira | 401k | roth_401k | hsa | 529
    tax_type: taxable
    # How often this account's holdings ACTUALLY change. Not how often to look.
    # weekly | biweekly | semimonthly | monthly | quarterly | annually
    #   | on_activity (changes only when you trade, never nudged on a calendar)
    #   | never
    # A payroll-fed account is reliably out of date a known number of pay
    # periods after it was last confirmed, and that is what gets reported:
    # "two contributions have landed", not "29 days old".
    update_cadence: on_activity
    mask4: "1234"               # LAST FOUR DIGITS ONLY. Never the full number.

  - account_id: fid-roth
    platform: fidelity
    label: "Fidelity Roth IRA"
    tax_type: roth_ira
    mask4: "5678"

  - account_id: rh-individual
    platform: robinhood
    label: "Robinhood"
    tax_type: taxable
    mask4: "9012"

  # Accounts you only see through Empower (an old 401k, an HSA) go here too.
  # Anything Empower reports that is ALSO exported directly from the broker gets
  # deduped automatically, with the broker's own numbers winning.
  #
  # A 401k holding BOTH Roth and pre-tax money should be split into two accounts.
  # That distinction decides whether the balance is ever taxed again, and no
  # report can recover it once the two are added together.
  - account_id: emp-401k-pretax
    platform: empower
    label: "Employer 401k - pre-tax sources"
    tax_type: 401k
    mask4: "3456"

  - account_id: emp-401k-roth
    platform: empower
    label: "Employer 401k - Roth sources"
    tax_type: roth_401k
    mask4: "3456"


# Optional. Drives the allocation drift section. Must sum to 1.0.
# Delete this block entirely if you would rather not set targets, and drift
# reporting will be skipped instead of comparing against numbers you never chose.
# Leave it empty if a large chunk of the book is earmarked cash (a house fund,
# say), or every report will flag a permanent overweight that you put there on
# purpose.
targets:
  us_equity: 0.65
  intl_equity: 0.15
  bond: 0.15
  cash: 0.05


# Tickers that track the same underlying thing, collapsed into one exposure for
# concentration reporting. Without this, holding the S&P 500 through a 401k pool,
# VOO, and FXAIX reads as three moderate positions instead of one large one, and
# the report understates your real concentration.
# A symbol may appear in only one group.
exposure_groups:
  # sp500:
  #   - VOO
  #   - FXAIX
  #   - FID500IDX
  # cash_equivalent:
  #   - SPAXX
  #   - SGOV


# What the market data provider needs when it differs from what the broker shows.
# Crypto is the common case; a 401k collective trust with no public ticker is the
# other, priced off its retail equivalent.
symbol_overrides:
  # BTC: BTC-USD
  # FID500IDX: FXAIX


# Optional. enrich.py guesses asset class from the fund name and yfinance
# metadata, which works for obvious cases and misses judgment calls. Pin
# anything it gets wrong here.
# Valid: us_equity | intl_equity | bond | cash | alt | unknown
asset_class_overrides:
  # SPAXX: cash
  # VXUS: intl_equity
  # BND: bond


thresholds:
  # Flag any single position above this share of the portfolio.
  concentration_warn_pct: 0.10

  # Minimum unrealized loss worth a tax-loss harvesting look. Agent 3.
  tlh_min_loss_usd: 500

  # Warn about short-term lots crossing into long-term treatment within N days.
  long_term_watch_days: 60

  # Surface earnings dates landing within N days.
  earnings_watch_days: 30
